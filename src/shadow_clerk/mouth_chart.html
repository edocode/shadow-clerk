<style>
/* Layout: phonetics-chart reference — sound picker on top, mouth drawing left, articulation notes right */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14171E; --panel:#1C2029; --fg:#E7E9EE; --muted:#9AA1B2; --line:#323846;
  --accent:#9DB6E6; --accent-soft:#25304A;
  --tooth:#E9EAEE; --lip:#C98A96; --lip-line:#F0B8C4; --air:#6AAEF2;
  --c-bg:#4A2419; --c-fg:#F6C3B3; --n-bg:#47320F; --n-fg:#F5D59A; --f-bg:#2C303A; --f-fg:#C4C8D2;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171E; --panel:#1C2029; --fg:#E7E9EE; --muted:#9AA1B2; --line:#323846;
  --accent:#9DB6E6; --accent-soft:#25304A;
  --tooth:#E9EAEE; --lip:#C98A96; --lip-line:#F0B8C4; --air:#6AAEF2;
  --c-bg:#4A2419; --c-fg:#F6C3B3; --n-bg:#47320F; --n-fg:#F5D59A; --f-bg:#2C303A; --f-fg:#C4C8D2;
  color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.5rem;margin:0 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 20px;font-size:.92rem}
.picker{display:grid;gap:10px;margin-bottom:20px}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.grp-name{font-size:.75rem;letter-spacing:.06em;color:var(--muted);width:4.5em;flex-shrink:0}
.snd{font-family:var(--ipa);font-size:1.05rem;min-width:2.6em;padding:4px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.snd:hover{border-color:var(--accent)}
.snd:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.snd[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr);padding:14px}}
svg text{font-family:var(--sans);font-size:12px;fill:var(--muted)}
.ink{fill:none;stroke:var(--fg);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.faint{fill:none;stroke:var(--muted);stroke-width:.8;opacity:.6}
.tooth{fill:var(--tooth);stroke:var(--fg);stroke-width:.8}
.lip{fill:var(--lip);stroke:var(--lip-line);stroke-width:1}
.word{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;display:grid;gap:8px}
.wrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.wrow.small{font-size:.85rem}
.wlabel{font-size:.78rem;letter-spacing:.04em;color:var(--muted)}
#ipa{font-family:var(--ipa);font-size:1.3rem;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);flex:1;min-width:0;width:10em}
#ipa:focus-visible,#word:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#word{font-size:1rem;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:8em;min-width:0}
select,.mini{font-family:inherit;font-size:.82rem;padding:3px 8px;border-radius:5px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.exw{display:flex;flex-wrap:wrap;gap:6px}
.exw button{font-family:inherit;font-size:.82rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.exw button span{font-family:var(--ipa);color:var(--muted);margin-left:4px}
.seq{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.seq button{font-family:var(--ipa);font-size:1.1rem;min-width:2.2em;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;transition:background .1s}
.seq button.on{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.werr{margin:0;font-size:.82rem;color:var(--c-fg);min-height:1em}
.ctrl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.playbtn{font-family:inherit;font-size:.88rem;padding:6px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--panel);cursor:pointer}
.playbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.loop{font-size:.85rem;color:var(--muted);display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.phase{font-size:.8rem;color:var(--accent);min-height:1.2em}
.views{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.views figure{margin:0;border:1px solid var(--line);border-radius:8px;padding:8px}
.views svg{width:100%;display:block}
.views figcaption{font-size:.75rem;color:var(--muted);text-align:center;margin-top:2px}
.crossnote{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.78rem;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;border:1px solid currentColor}
.hd{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.sym{font-family:var(--ipa);font-size:3rem;font-weight:600;line-height:1;color:var(--accent)}
.cat{font-size:.85rem;color:var(--muted)}
.ex{margin:8px 0 10px;font-size:1rem}
.ex em{font-style:normal;color:var(--muted);font-size:.8rem;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:.75rem;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.chip.link{cursor:pointer;border:none;font-family:inherit}
.chip.link:hover{text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td{padding:7px 6px;border-top:1px solid var(--line);vertical-align:top}
td.part{white-space:nowrap;font-weight:500}
td.tag{white-space:nowrap;width:1%}
td.txt{color:var(--muted)}
.num{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:.7rem;margin-right:6px;border:1px solid var(--line)}
.t{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:5px}
.t-c{background:var(--c-bg);color:var(--c-fg)} .t-n{background:var(--n-bg);color:var(--n-fg)} .t-f{background:var(--f-bg);color:var(--f-fg)}
.tip{margin-top:14px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:.88rem}
.tip b{color:var(--accent);font-weight:700;margin-right:6px}
.foot{color:var(--muted);font-size:.78rem;margin-top:16px;max-width:65ch}
</style>

<div class="wrap">
  <h1>英語発音 口のかたち図鑑</h1>
  <p class="lead">記号を押すと、横から見た口の中・正面からの舌の断面・部位ごとのポイントが切り替わります。</p>
  <section class="word" aria-label="単語の動き">
    <div class="wrow">

      <input id="ipa" value="θɪŋk" autocomplete="off" spellcheck="false">
      <label for="word" class="wlabel">つづり</label>
      <input id="word" value="think" autocomplete="off" spellcheck="false" placeholder="読み上げ用（空なら音なし）">
      <button class="playbtn" onclick="playWord()">▶ 単語を再生</button>
    </div>
    <div class="wrow small">
      <span class="wlabel">例</span>
      <span id="exw" class="exw"></span>
    </div>
    <div class="wrow small">
      <label class="loop"><input type="checkbox" id="tapmode"> 下の記号ボタンで入力する</label>
      <button class="mini" onclick="bs()">1字消す</button>
      <button class="mini" onclick="clr()">全部消す</button>
      <label class="loop" for="speed">速さ</label>
      <select id="speed"><option value="0.25">とてもゆっくり</option><option value="0.5" selected>ゆっくり</option><option value="1">ふつう</option></select>
      <label class="loop" for="rtype">r の型</label>
      <select id="rtype"><option value="rb" selected>もり上げ型</option><option value="r">反り舌型</option></select>
    </div>
    <div id="seq" class="seq" aria-live="polite"></div>
    <p id="werr" class="werr"></p>
  </section>
  <div class="picker" id="picker"></div>
  <div class="main">
    <div>

        <title id="sideT">横から見た口の中</title>
        <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
        <path id="ulip" class="lip"/>

        <text x="16" y="60">唇</text>
      </svg>
      <div class="ctrl">
        <button id="play" class="playbtn" onclick="play()">▶ 動きを再生</button>
        <label class="loop"><input type="checkbox" id="loop"> くり返す</label>
        <span class="phase" id="phase"></span>
      </div>
      <div class="views">
        <figure>
          <svg id="front" viewBox="0 0 220 205" role="img" aria-labelledby="frontT">
            <title id="frontT">正面から見た口元</title>
            <defs><clipPath id="opclip"><path id="opp"/></clipPath></defs>

            <path id="flip" class="lip"/>

              <rect x="40" y="80" width="140" height="90" style="fill:#2A2024"/>
              <ellipse id="ftongue" cx="110" cy="150" rx="26" ry="12" fill="#F0997B" stroke="#993C1D" stroke-width=".8"/>
              <rect id="utooth" x="78" y="100" width="64" height="20" rx="3" class="tooth"/>
              <rect id="btooth" x="80" y="122" width="60" height="18" rx="3" class="tooth"/>

              <path id="tlines" stroke="var(--muted)" stroke-width=".7" fill="none"/>

            <path id="fline" fill="none" stroke="var(--lip-line)" stroke-width="1.1" stroke-linecap="round"/>
            <path id="fwrink" fill="none" stroke="var(--lip-line)" stroke-width=".8" stroke-linecap="round"/>
          </svg>
          <figcaption>正面から見た口元</figcaption>
        </figure>
        <figure>
          <svg viewBox="52 296 216 140" role="img" aria-labelledby="crossT">
          <title id="crossT">正面から見た舌の断面</title>
          <rect x="62" y="338" width="20" height="34" rx="4" class="tooth"/>
          <rect x="238" y="338" width="20" height="34" rx="4" class="tooth"/>
          <path class="ink" d="M82 345 Q160 300 238 345"/>
          <path id="cross" fill="#F0997B" stroke="#993C1D" stroke-width="1" opacity=".9"/>
          <g id="air"></g>
          </svg>
          <figcaption>舌の断面（狭めの位置）</figcaption>
        </figure>
      </div>
      <p class="crossnote" id="cnote"></p>
      <div class="legend">
        <span><i class="dot" style="background:var(--c-bg);color:var(--c-fg)"></i>触れる</span>
        <span><i class="dot" style="background:var(--n-bg);color:var(--n-fg)"></i>近づける</span>
        <span><i class="dot" style="background:var(--f-bg);color:var(--f-fg)"></i>離す</span>
        <span><i class="dot" style="background:var(--air);color:var(--air)"></i>息の通り道</span>
      </div>
    </div>
    <div>
      <div class="hd"><span class="sym" id="sym"></span><span class="cat" id="cat"></span></div>
      <div class="ex" id="ex"></div>
      <div class="chips" id="chips"></div>
      <table><tbody id="rows"></tbody></table>
      <div class="tip" id="tip"></div>
    </div>
  </div>
  <p class="foot">図は発音練習のための模式図です。実際の舌の形には個人差があり、前後の音によっても変わります。英語の r には唇・口蓋・喉の奥の3か所の狭めがあり、喉の奥の狭めの強さは人によって異なります。反り舌型ともり上げ型は同じように聞こえ、舌先も上がる中間的な型の人もいます。</p>
  <p class="foot">本物の映像と見比べるには: <a href="https://seeingspeech.ac.uk/" target="_blank" rel="noopener">Seeing Speech</a>（IPA 各音の MRI・超音波映像）、Sounds of Speech（各音のアニメーション。スマホアプリ）</p>
</div>

 // front view
 const cx=110,cy=120,yc=cy+q.oy,mw=q.mw,oh=Math.max(q.oh,0),ow=q.ow;
 const ry=oh/2+11+Math.max(0,70-mw)*.13,x0=cx-mw/2,x1=cx+mw/2;
 $('flip').setAttribute('d',`M${f1(x0)} ${f1(yc)} C${f1(x0+mw*.15)} ${f1(yc-ry*1.15)} ${f1(cx-mw*.14)} ${f1(yc-ry)} ${cx} ${f1(yc-ry+3)} C${f1(cx+mw*.14)} ${f1(yc-ry)} ${f1(x1-mw*.15)} ${f1(yc-ry*1.15)} ${f1(x1)} ${f1(yc)} C${f1(x1-mw*.12)} ${f1(yc+ry*1.25)} ${f1(x0+mw*.12)} ${f1(yc+ry*1.25)} ${f1(x0)} ${f1(yc)} Z`);
 const ox0=cx-ow/2,ox1=cx+ow/2,h=oh/2;
 $('opp').setAttribute('d',`M${f1(ox0)} ${f1(yc)} C${f1(ox0+ow*.1)} ${f1(yc-h*1.3)} ${f1(ox1-ow*.1)} ${f1(yc-h*1.3)} ${f1(ox1)} ${f1(yc)} C${f1(ox1-ow*.1)} ${f1(yc+h*1.3)} ${f1(ox0+ow*.1)} ${f1(yc+h*1.3)} ${f1(ox0)} ${f1(yc)} Z`);
 $('fline').setAttribute('d',`M${f1(x0+2)} ${f1(yc)} Q${cx} ${f1(yc+1)} ${f1(x1-2)} ${f1(yc)}`);
 $('fline').setAttribute('opacity',oh<2?1:0);
 const lowTop=cy+2+jd*.9;
 $('utooth').setAttribute('y',cy-20);
 $('btooth').setAttribute('y',f1(lowTop));
 $('ftongue').setAttribute('cy',f1(lowTop+16));
 $('fth').setAttribute('opacity',f1(q.th));
 $('tlines').setAttribute('d',`M110 ${cy-20} L110 ${cy} M96 ${cy-20} L96 ${cy} M124 ${cy-20} L124 ${cy} M110 ${f1(lowTop)} L110 ${f1(lowTop+18)}`);
 const w=Math.max(0,(56-mw)/14);
 $('fwrink').setAttribute('opacity',f1(Math.min(1,w)*.7));
 $('fwrink').setAttribute('d',[[-.3,-1],[0,-1.1],[.3,-1],[-.3,1],[0,1.15],[.3,1]].map(([a,b])=>{const xx=cx+a*mw*.8,yy=yc+b*ry;return `M${f1(xx)} ${f1(yy-b*1)} L${f1(xx+a*4)} ${f1(yy+b*5)}`}).join(' '));
}

let cur=REST,token=0,curSound=null;
function animate(to,dur){return new Promise(res=>{const from=cur,my=token,t0=performance.now();
 if(reduce||dur<=0){cur=to;draw(cur);return res(true)}
 const step=now=>{if(my!==token)return res(false);const k=Math.min(1,(now-t0)/dur);cur=lerp(from,to,ease(k));draw(cur);k<1?requestAnimationFrame(step):res(true)};
 requestAnimationFrame(step)})}
const wait=ms=>new Promise(r=>setTimeout(r,reduce?0:ms));

function setCross(key){const x=X[key];$('cross').setAttribute('d',x.p);
 $('air').innerHTML=x.a.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" style="fill:var(--air)"/>`).join('');$('cnote').textContent=x.n}
function setMarks(s){if(!s||s.from){$('marks').innerHTML='';return}const t=T[s.T];
 const pos={tip:t.t,blade:t.b,front:t.f,back:t.k,root:[t.r,232]};
 $('marks').innerHTML=s.r.filter(r=>NUM[r[0]]&&r[1]).map(r=>{const p=pos[r[0]],v=TAGVAR[r[1]];
  return `<circle cx="${p[0]}" cy="${p[1]}" r="10" style="fill:var(${v[0]});stroke:var(${v[1]})" stroke-width="1"/><text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="central" style="fill:var(${v[1]});font-size:11px">${NUM[r[0]]}</text>`}).join('')}
const phase=t=>$('phase').textContent=t;

function info(s){
 $('sym').textContent='/'+s.s+'/';
 $('cat').textContent=s.g+(s.lab?'・'+s.lab:'');
 $('ex').innerHTML='<em>例</em>'+s.ex+' <button class="mini" onclick="say(curSound.ex)">🔊 聞く</button>';
 let chips=`<span class="chip">${s.v?'有声（声帯が震える）':'無声（声帯は震えない）'}</span>`;
 if(s.nas)chips+='<span class="chip">鼻から息が出る</span>';
 if(s.from)chips+=`<button class="chip link" onclick="pick('${s.from}')">始まり /${byId[s.from].s}/</button><button class="chip link" onclick="pick('${s.to}')">終わり /${byId[s.to].s}/</button>`;
 if(s.pair){const p=byId[s.pair];chips+=`<button class="chip link" onclick="pick('${p.id}')">同じ形で${p.v?'声あり':'声なし'}：/${p.s}/</button>`}
 if(s.id==='r')chips+=`<button class="chip link" onclick="pick('rb')">もり上げ型を見る</button>`;
 if(s.id==='rb')chips+=`<button class="chip link" onclick="pick('r')">反り舌型を見る</button>`;
 $('chips').innerHTML=chips;
 $('rows').innerHTML=s.r.map(r=>`<tr><td class="part">${NUM[r[0]]&&r[1]&&!s.from?`<span class="num">${NUM[r[0]]}</span>`:''}${PART[r[0]]}</td><td class="tag">${r[1]?`<span class="t t-${r[1]}">${TAG[r[1]]}</span>`:''}</td><td class="txt">${r[2]}</td></tr>`).join('');
 $('tip').innerHTML='<b>コツ</b>'+s.tip;
 document.querySelectorAll('.snd').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===s.id?'true':'false'));
}

async function show(id){const s=byId[id]||byId.l;curSound=s;token++;phase('');$('marks').innerHTML='';info(s);
 const ok=await animate(stateOf(s),380);if(!ok)return;setCross(s.x);setMarks(s);
 if(s.from)play()}

async function play(){const s=curSound;if(!s)return;const my=++token;$('marks').innerHTML='';
 do{
  if(s.from){const a=byId[s.from],b=byId[s.to];
   phase('準備');if(!await animate(REST,300))return;setCross('open');
   phase('始まり /'+a.s+'/');if(!await animate(stateOf(a),350))return;setCross(a.x);await wait(300);if(my!==token)return;
   phase('/'+a.s+'/ → /'+b.s+'/');if(!await animate(stateOf(b),750))return;setCross(b.x);await wait(500);if(my!==token)return;
  }else{
   phase('準備');if(!await animate(REST,300))return;setCross('open');await wait(150);if(my!==token)return;
   phase('/'+s.s+'/ の形へ');if(!await animate(stateOf(s),450))return;setCross(s.x);
   phase('/'+s.s+'/');await wait(700);if(my!==token)return;
   phase('ほどく');if(!await animate(REST,450))return;setCross('open');await wait(250);if(my!==token)return;
  }
 }while($('loop').checked&&my===token);
 if(my!==token)return;
 phase('');const ok=await animate(stateOf(s),350);if(!ok)return;setCross(s.x);setMarks(s);
}
function pick(id){
 if($('tapmode').checked){const s=byId[id];$('ipa').value+=(s.id==='rb'?'r':s.s);preview();return}
 if(location.hash!=='#'+id)location.hash=id;else show(id)}

// ---------- word playback ----------
const MAP={'ɜːr':'er','tʃ':'ch','ʧ':'ch','dʒ':'dj','ʤ':'dj','eɪ':'ey','aɪ':'ay','ɔɪ':'oy','aʊ':'aw','oʊ':'ow','əʊ':'ow','ɜː':'er','iː':'iy','uː':'uw','ɑː':'aa','ɔː':'ao',
 'ɝ':'er','ɚ':'er','ɜ':'er','i':'iy','u':'uw','ɑ':'aa','ɒ':'aa','ɔ':'ao','o':'ao','a':'ae','æ':'ae','ʌ':'ah','ɐ':'ah','ə':'ax','ɪ':'ih','ʊ':'uh','e':'eh','ɛ':'eh',
 'p':'p','b':'b','t':'t','d':'d','k':'k','c':'k','g':'g','ɡ':'g','f':'f','v':'v','θ':'th','ð':'dh','s':'s','z':'z','ʃ':'sh','ʒ':'zh','h':'h',
 'm':'m','n':'n','ŋ':'ng','l':'l','ɫ':'l','r':'R','ɹ':'R','ɾ':'d','w':'w','j':'y','y':'y'};
const KEYS=Object.keys(MAP).sort((a,b)=>b.length-a.length);
const SKIP=/[\s\/\[\]ˈˌ.'‿ːʳ,-]/;
function parse(str){const out=[],bad=[];let i=0;str=str.normalize('NFC');
 while(i<str.length){if(SKIP.test(str[i])){i++;continue}
  const k=KEYS.find(k=>str.startsWith(k,i));
  if(k){let id=MAP[k];if(id==='R')id=$('rtype').value;out.push(id);i+=k.length}else{bad.push(str[i]);i++}}
 return {ids:out,bad:[...new Set(bad)]}}
function preview(){const {ids,bad}=parse($('ipa').value);
 $('seq').innerHTML=ids.map((id,i)=>`<button data-i="${i}" onclick="pick('${id}')" title="${byId[id].ex}">${byId[id].s}</button>`).join('');
 $('werr').textContent=bad.length?`読み取れない文字：${bad.join(' ')}（無視して再生します）`:'';
 return ids}
const LONG=new Set(['iy','uw','aa','ao','er']);
const STOP=new Set(['p','b','t','d','k','g','ch','dj']);
function dur(s){if(STOP.has(s.id))return [90,70];if(s.g==='母音')return [150,LONG.has(s.id)?260:160];return [110,100]}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function lit(i){document.querySelectorAll('#seq button').forEach(b=>b.classList.toggle('on',+b.dataset.i===i))}

async function playWord(){const ids=preview();if(!ids.length)return;const my=++token;$('marks').innerHTML='';
 const sp=+$('speed').value;
 do{
  phase('準備');lit(-1);if(!await animate(REST,250/sp))return;setCross('open');await sleep(120/sp);if(my!==token)return;
  say($('word').value);
  for(let i=0;i<ids.length;i++){const s=byId[ids[i]];lit(i);info(s);phase('/'+s.s+'/');
   if(s.from){const a=byId[s.from],b=byId[s.to];
    if(!await animate(stateOf(a),150/sp))return;setCross(a.x);await sleep(80/sp);if(my!==token)return;
    if(!await animate(stateOf(b),230/sp))return;setCross(b.x);await sleep(120/sp);if(my!==token)return;
   }else{const [m,h]=dur(s);
    if(!await animate(stateOf(s),m/sp))return;setCross(s.x);await sleep(h/sp);if(my!==token)return;}
  }
  lit(-1);phase('ほどく');if(!await animate(REST,300/sp))return;setCross('open');await sleep(300/sp);if(my!==token)return;
 }while($('loop').checked&&my===token);
 phase('');}
function bs(){const v=[...$('ipa').value];v.pop();$('ipa').value=v.join('');$('word').value='';preview()}
function clr(){$('ipa').value='';$('word').value='';preview()}
// ブラウザの声で英語を読む。速さは動きの速さに合わせる（声は時刻を返さないので、口の動きとは同時に始めるだけ）
const RATE={'0.25':.5,'0.5':.7,'1':1};
// 練習する英語（設定の english_accent）で読む。設定を読めなければ（ファイルとして開いたときなど）米音
let LANG='en-US';
fetch('/api/config').then(r=>r.json()).then(c=>{if(c.english_accent==='british')LANG='en-GB'}).catch(()=>{});
// その言語の声。無ければほかの英語の声で読む（黙らない）
function pickVoice(vs,lang){const re=new RegExp('^'+lang.replace('-','[-_]'),'i');return vs.find(v=>re.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
function say(text){
 if(!text||!('speechSynthesis' in window))return;
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang=LANG;u.voice=pickVoice(speechSynthesis.getVoices(),LANG);
 u.rate=RATE[$('speed').value]||.7;speechSynthesis.speak(u)}
const EXW=[['think','θɪŋk'],['three','θriː'],['world','wɜːrld'],['girl','ɡɜːrl'],['light','laɪt'],['right','raɪt'],['really','rɪli'],['thank you','θæŋk juː'],['vision','vɪʒən'],['judge','dʒʌdʒ'],['about','əbaʊt'],['strength','streŋθ']];
$('exw').innerHTML=EXW.map(([w,p])=>`<button onclick="$('ipa').value='${p}';$('word').value='${w}';preview();playWord()">${w}<span>${p}</span></button>`).join('');
$('ipa').addEventListener('input',()=>{$('word').value='';preview()});
$('ipa').addEventListener('keydown',e=>{if(e.key==='Enter')playWord()});
$('rtype').addEventListener('change',preview);
preview();

const groups=[...new Set(S.map(s=>s.g))];
$('picker').innerHTML=groups.map(g=>`<div class="grp"><span class="grp-name">${g}</span>${S.filter(s=>s.g===g).map(s=>`<button class="snd" data-id="${s.id}" title="${s.ex}" onclick="pick('${s.id}')">${s.s}${s.lab?`<small style="font-family:var(--sans);font-size:.65rem;margin-left:3px">${s.lab.replace('型','')}</small>`:''}</button>`).join('')}</div>`).join('');
draw(REST);
const route=()=>show((location.hash||'').slice(1)||'l');
addEventListener('hashchange',route);
// ダッシュボードの発音記号のリンク（/mouth?ipa=θ・/mouth?ipa=θɪŋk&word=think）。1音ならその音を、2音以上なら単語として再生する
// （開いた直後はブラウザが読み上げを許さないので、音は再生ボタンを押したときから出る）
const qIpa=new URLSearchParams(location.search).get('ipa');
const qIds=qIpa?parse(qIpa).ids:[];
if(qIds.length===1)show(qIds[0]);
else if(qIds.length){$('ipa').value=qIpa;$('word').value=new URLSearchParams(location.search).get('word')||'';preview();show(qIds[0]).then(playWord);}
else route();
</script>
