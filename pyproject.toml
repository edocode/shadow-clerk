[project]
name = "shadow-clerk"
version = "0.5.0"
description = "Real-time audio recording and transcription tool for web meetings"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Atsushi Kato", email = "ktat.is@gmail.com"},
]
keywords = [
    "meeting",
    "transcription",
    "speech-to-text",
    "whisper",
    "real-time",
    "audio",
    "japanese",
    "asr",
    "translation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
    "Natural Language :: English",
    "Natural Language :: Japanese",
]
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.11",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "pynput>=1.7.6",
    "evdev>=1.6.0; sys_platform == 'linux'",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    # AI Console の疑似端末。POSIX は標準ライブラリの pty、Windows は ConPTY
    "pywinpty>=2.0.13; sys_platform == 'win32'",
    "langdetect>=1.0.9",
    "pyte>=0.8.2",
    "markdown-it-py>=3.0",
    "onnxruntime>=1.30.0",
]

[project.urls]
Homepage = "https://github.com/edocode/shadow-clerk"
Repository = "https://github.com/edocode/shadow-clerk"
Issues = "https://github.com/edocode/shadow-clerk/issues"

[project.optional-dependencies]
spell-check = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
]
# Note: reazonspeech-k2-asr is published only via Git, not on PyPI, so it
# cannot be declared here (PyPI rejects direct URL references in metadata).
# After installing this extra, also run:
#   uv pip install "reazonspeech-k2-asr @ git+https://github.com/reazon-research/ReazonSpeech.git#subdirectory=pkg/k2-asr"
reazonspeech = [
    "sherpa-onnx>=1.12.28",
]
# Moonshine Voice (asr_engine: moonshine). Non-English models are under the
# non-commercial Moonshine Community License.
moonshine = [
    "moonshine-voice>=0.1.5",
]
gcal = [
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
]
# 話者分離 (speaker_diarization: true で有効化)
# huggingface_hub は faster-whisper の推移的依存として常に利用可能
diarization = [
    "onnxruntime>=1.16.0",
    "kaldi-native-fbank>=1.17.0",
]

# 音素レベルの発音フィードバック (clerk-practice)。espeak-ng はホイールで入るので sudo は要らない。
# transformers は固定しない: G2P は phonemizer-fork から直接呼ぶので、
# Wav2Vec2PhonemeCTCTokenizer.phonemize() の不具合 (huggingface/transformers#45198) に当たらない。
pronounce = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "espeakng-loader>=0.2.4",
    "phonemizer-fork>=3.3.2",
]

# 聞き間違いの目印 (kana_hint: true)。文字起こしの読みを形態素解析で取り、
# かな認識モデル (wav2vec2) の音と食い違う語に「(音のかな?)」を添える
kana-hint = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sudachipy>=0.6.8",
    "sudachidict-core>=20240409",
]

[project.scripts]
clerk-daemon = "shadow_clerk.clerk_daemon:main"
clerk-util = "shadow_clerk.clerk_util:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# スキル実体（clerk-util install-skill の配布元）と、VOICEVOX へ足す読みのプリセットを wheel に載せる
[tool.setuptools.package-data]
shadow_clerk = ["skills/**/*.md", "skills/**/*.py", "talk_prompts/*.md", "voicevox_dict.tsv"]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pylint>=4.1.2",
    "pytest>=8.0",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# mixin パターン: 属性は複数 mixin の組み合わせで定義されるため false positive が多い
module = [
    "shadow_clerk._daemon_recorder",
    "shadow_clerk._daemon_recorder_capture",
    "shadow_clerk._daemon_recorder_command",
    "shadow_clerk._daemon_recorder_transcribe",
    "shadow_clerk._daemon_recorder_translate",
]
disable_error_code = ["attr-defined", "misc", "has-type", "assignment", "union-attr", "type-var", "arg-type"]

[[tool.mypy.overrides]]
# サブクラスパターン: ベースクラスがサブクラスで定義されたメソッド/属性を参照
module = [
    "shadow_clerk._daemon_dashboard_base",
    "shadow_clerk._daemon_dashboard_ops",
    "shadow_clerk._daemon_dashboard_ops_config",
    "shadow_clerk._daemon_dashboard_ops_console",
    "shadow_clerk._daemon_dashboard_ops_meeting",
    "shadow_clerk._daemon_dashboard_ops_screenshot",
    "shadow_clerk._daemon_dashboard_ops_skill",
    "shadow_clerk._daemon_dashboard_ops_speaker_groups",
    "shadow_clerk._daemon_dashboard_ops_speakers",
    "shadow_clerk._daemon_dashboard_ops_talk",
]
disable_error_code = ["attr-defined"]
