[project]
name = "shadow-clerk"
version = "0.2.0"
description = "Real-time audio recording and transcription tool for web meetings"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.11",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "pynput>=1.7.6",
    "evdev>=1.6.0; sys_platform == 'linux'",
    "soundcard>=0.4.0; sys_platform == 'win32'",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
spell-check = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
]
reazonspeech = [
    "sherpa-onnx>=1.12.28",
    "reazonspeech-k2-asr @ git+https://github.com/reazon-research/ReazonSpeech.git#subdirectory=pkg/k2-asr",
]
gcal = [
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
]

[project.scripts]
clerk-daemon = "shadow_clerk.clerk_daemon:main"
clerk-util = "shadow_clerk.clerk_util:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shadow_clerk = ["data/*.template"]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# mixin パターン: 属性は複数 mixin の組み合わせで定義されるため false positive が多い
module = [
    "shadow_clerk._daemon_recorder",
    "shadow_clerk._daemon_recorder_capture",
    "shadow_clerk._daemon_recorder_command",
    "shadow_clerk._daemon_recorder_transcribe",
]
disable_error_code = ["attr-defined", "misc", "has-type", "assignment", "union-attr", "type-var", "arg-type"]

[[tool.mypy.overrides]]
# サブクラスパターン: ベースクラスがサブクラスで定義されたメソッド/属性を参照
module = [
    "shadow_clerk._daemon_dashboard_base",
    "shadow_clerk._daemon_dashboard_ops",
]
disable_error_code = ["attr-defined"]
