[project]
name = "shadow-clerk"
version = "0.2.0"
description = "Real-time audio recording and transcription tool for web meetings"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Atsushi Kato", email = "ktat.is@gmail.com"},
]
keywords = [
    "meeting",
    "transcription",
    "speech-to-text",
    "whisper",
    "real-time",
    "audio",
    "japanese",
    "asr",
    "translation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
    "Natural Language :: English",
    "Natural Language :: Japanese",
]
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "webrtcvad-wheels>=2.0.11",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "pynput>=1.7.6",
    "evdev>=1.6.0; sys_platform == 'linux'",
    "PyAudioWPatch>=0.2.12; sys_platform == 'win32'",
    "langdetect>=1.0.9",
]

[project.urls]
Homepage = "https://github.com/edocode/shadow-clerk"
Repository = "https://github.com/edocode/shadow-clerk"
Issues = "https://github.com/edocode/shadow-clerk/issues"

[project.optional-dependencies]
spell-check = [
    "transformers>=4.30.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
]
# Note: reazonspeech-k2-asr is published only via Git, not on PyPI, so it
# cannot be declared here (PyPI rejects direct URL references in metadata).
# After installing this extra, also run:
#   uv pip install "reazonspeech-k2-asr @ git+https://github.com/reazon-research/ReazonSpeech.git#subdirectory=pkg/k2-asr"
reazonspeech = [
    "sherpa-onnx>=1.12.28",
]
gcal = [
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
]

[project.scripts]
clerk-daemon = "shadow_clerk.clerk_daemon:main"
clerk-util = "shadow_clerk.clerk_util:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# mixin パターン: 属性は複数 mixin の組み合わせで定義されるため false positive が多い
module = [
    "shadow_clerk._daemon_recorder",
    "shadow_clerk._daemon_recorder_capture",
    "shadow_clerk._daemon_recorder_command",
    "shadow_clerk._daemon_recorder_transcribe",
]
disable_error_code = ["attr-defined", "misc", "has-type", "assignment", "union-attr", "type-var", "arg-type"]

[[tool.mypy.overrides]]
# サブクラスパターン: ベースクラスがサブクラスで定義されたメソッド/属性を参照
module = [
    "shadow_clerk._daemon_dashboard_base",
    "shadow_clerk._daemon_dashboard_ops",
]
disable_error_code = ["attr-defined"]
