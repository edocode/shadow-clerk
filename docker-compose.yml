services:
  shadow-clerk:
    build: .
    ports:
      - "8765:8765"
    volumes:
      - ./data:/data
      - /run/user/${UID:-1000}/pulse:/run/pulse
    environment:
      SHADOW_CLERK_DATA_DIR: /data
      PULSE_SERVER: unix:/run/pulse/native
    depends_on:
      voicevox:
        condition: service_healthy

  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    ports:
      - "50021:50021"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:50021/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
